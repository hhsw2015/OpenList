name: Beta Release builds

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      scope:
        description: "Build scope"
        required: true
        default: "mainstream"
        type: choice
        options:
          - turbo       # single target, defaults to darwin-arm64 (~2-3 min)
          - mainstream  # linux/darwin/windows amd64+arm64 (~5 min)
          - full        # all 8 matrix legs incl. musl/mips/loong/win7/android/freebsd (~30 min)
      turbo_target:
        description: "Turbo target (only used when scope=turbo). e.g. darwin-arm64, linux-amd64, windows-amd64"
        required: false
        default: "darwin-arm64"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  changelog:
    name: Beta Release Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create or update ref
        id: create-or-update-ref
        uses: ovsds/create-or-update-ref-action@v1
        with:
          ref: tags/beta
          sha: ${{ github.sha }}

      - name: Delete beta tag
        run: git tag -d beta
        continue-on-error: true

      - name: changelog # or changelogithub@0.12 if ensure the stable result
        id: changelog
        run: |
          git tag -l
          npx changelogithub --output CHANGELOG.md

      - name: Upload assets to beta release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub release body max 125000 chars; truncate for --notes-file
          head -c 124000 CHANGELOG.md > CHANGELOG.notes.md
          if [ "$(wc -c < CHANGELOG.md)" -gt 124000 ]; then
            printf '\n\n...changelog truncated. See full CHANGELOG.md asset.\n' >> CHANGELOG.notes.md
          fi
          if ! gh release view beta; then
            gh release create beta --prerelease --notes-file CHANGELOG.notes.md
          else
            gh release edit beta --prerelease --notes-file CHANGELOG.notes.md
          fi
          gh release upload beta "CHANGELOG.md" --clobber

      - name: Upload assets to github artifact
        uses: actions/upload-artifact@v7
        with:
          name: beta changelog
          path: ${{ github.workspace }}/CHANGELOG.md
          compression-level: 0
          if-no-files-found: error # 'warn' or 'ignore' are also available, defaults to `warn`

  release:
    needs:
      - changelog
    strategy:
      matrix:
        include:
          # ---- mainstream: always built (push + any workflow_dispatch) ----
          - target: "!(*musl*|*windows-arm64*|*windows7-*|*android*|*freebsd*)" # xgo and loongarch (exclude mips64le)
            hash: "md5"
            flags: ""
            goflags: ""
            scope: "mainstream"
          # ---- extended: only when workflow_dispatch scope=full ----
          - target: "linux-(mips|mips64|mipsle|mips64le|loong64)-musl*" # musl-compat-family
            hash: "md5-linux-musl-mips"
            flags: "-ldflags=-linkmode external -extldflags '-static -fpic'"
            goflags: ""
            musl_static: "true"
            scope: "full"
          - target: "linux-!(arm*|mips|mips64|mipsle|mips64le|loong64)-musl*" # musl-not-arm (exclude compat-family)
            hash: "md5-linux-musl"
            flags: "-ldflags=-linkmode external -extldflags '-static -fpic'"
            goflags: ""
            musl_static: "true"
            scope: "full"
          - target: "linux-arm*-musl*" #musl-arm
            hash: "md5-linux-musl-arm"
            flags: "-ldflags=-linkmode external -extldflags '-static -fpic'"
            goflags: ""
            musl_static: "true"
            scope: "full"
          - target: "windows-arm64" #win-arm64
            hash: "md5-windows-arm64"
            flags: ""
            goflags: ""
            musl_static: "false"
            scope: "full"
          - target: "windows7-*" #win7
            hash: "md5-windows7"
            flags: ""
            goflags: "-tags=sqlite_cgo_compat"
            musl_static: "false"
            scope: "full"
          - target: "android-*" #android
            hash: "md5-android"
            flags: ""
            goflags: ""
            musl_static: "false"
            scope: "full"
          - target: "freebsd-*" #freebsd
            hash: "md5-freebsd"
            flags: ""
            goflags: ""
            musl_static: "false"
            scope: "full"

    name: Beta Release
    runs-on: ubuntu-latest
    steps:
      # Scope selection:
      #   turbo      → only the mainstream leg runs, and its glob is
      #                narrowed to a single platform (default darwin-arm64)
      #                → 1 target, ~2-3 min. For dev iteration.
      #   mainstream → the mainstream leg builds all its default targets
      #                (linux/darwin/windows amd64+arm64+386+loong64) → ~5 min.
      #   full       → every matrix leg runs, all 8 targets total → ~30 min.
      # Push events and default dispatch = mainstream.
      - name: Decide whether to build this leg
        id: gate
        run: |
          SCOPE="${{ github.event.inputs.scope }}"
          if [ -z "$SCOPE" ]; then SCOPE="mainstream"; fi

          case "$SCOPE" in
            full)
              RUN=true
              TARGET='${{ matrix.target }}'
              ;;
            turbo)
              if [ "${{ matrix.scope }}" = "mainstream" ]; then
                RUN=true
                TARGET="${{ github.event.inputs.turbo_target }}"
                [ -z "$TARGET" ] && TARGET="darwin-arm64"
              else
                RUN=false
              fi
              ;;
            *)
              # mainstream (default)
              if [ "${{ matrix.scope }}" = "mainstream" ]; then
                RUN=true
                TARGET='${{ matrix.target }}'
              else
                RUN=false
              fi
              ;;
          esac

          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          if [ "$RUN" = "true" ]; then
            echo "Building leg matrix.target=${{ matrix.target }} narrowed to '$TARGET' (scope=$SCOPE)"
          else
            echo "Skipping leg matrix.target=${{ matrix.target }} (scope=$SCOPE)"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"

      - name: Setup web
        if: steps.gate.outputs.run == 'true'
        run: bash build.sh dev web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_REPO: ${{ vars.FRONTEND_REPO }}

      - name: Build
        if: steps.gate.outputs.run == 'true'
        uses: OpenListTeam/cgo-actions@v1.2.5
        with:
          # Gate rewrites this to a single platform when scope=turbo.
          targets: ${{ steps.gate.outputs.target }}
          flags: ${{ matrix.flags || '-ldflags=' }}
          static-link-for-musl: true
          musl-target-format: $os-$musl-$arch
          github-token: ${{ secrets.GITHUB_TOKEN }}
          out-dir: build
          output: openlist-$target$ext
          musl-base-url: "https://github.com/OpenListTeam/musl-compilers/releases/latest/download/"
          x-flags: |
            github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=$built_at
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=The OpenList Projects Contributors <noreply@openlist.team>
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=$git_commit
            github.com/OpenListTeam/OpenList/v4/internal/conf.Version=$tag
            github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=rolling
        env:
          GOFLAGS: ${{ matrix.goflags }}

      - name: Verify musl binaries are static
        if: steps.gate.outputs.run == 'true' && matrix.musl_static == 'true'
        run: |
          set -e
          shopt -s nullglob
          files=(build/openlist-*-musl-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No musl binaries found"
            exit 1
          fi
          for f in "${files[@]}"; do
            if readelf -l "$f" | grep -q "Requesting program interpreter"; then
              echo "Dynamic binary detected: $f"
              readelf -l "$f" | grep "Requesting program interpreter" || true
              exit 1
            fi
          done

      - name: Compress
        if: steps.gate.outputs.run == 'true'
        run: |
          bash build.sh zip ${{ matrix.hash }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets to beta release
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in build/compress/*; do
            gh release upload beta "$file" --clobber
          done

      - name: Clean illegal characters from matrix.target
        if: steps.gate.outputs.run == 'true'
        id: clean_target_name
        run: |
          ILLEGAL_CHARS_REGEX='[":<>|*?\\/\r\n]'
          CLEANED_TARGET=$(echo "${{ matrix.target }}" | sed -E "s/$ILLEGAL_CHARS_REGEX//g")
          echo "Original target: ${{ matrix.target }}"
          echo "Cleaned target: $CLEANED_TARGET"
          echo "cleaned_target=$CLEANED_TARGET" >> $GITHUB_ENV

      - name: Upload assets to github artifact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: beta builds for ${{ env.cleaned_target }}
          path: ${{ github.workspace }}/build/compress/*
          compression-level: 0
          if-no-files-found: error # 'warn' or 'ignore' are also available, defaults to `warn`
